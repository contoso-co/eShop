$schema: "1.0"
name: "eshoponweb-dev-environment"
image: microsoftvisualstudio_visualstudioplustools_vs-2022-ent-general-win11-m365-gen2
tasks:
  - name: winget
    description: Install Git for Windows
    parameters:
      package: Git.Git
  - name: winget
    description: Install Docker Desktop
    parameters:
      package: Docker.DockerDesktop
  - name: winget
    description: Install SQL Server Management Studio
    parameters:
      package: Microsoft.SQLServerManagementStudio
  - name: winget
    description: Install Azure Data Studio
    parameters:
      package: Microsoft.AzureDataStudio
  - name: winget
    description: Install Postman
    parameters:
      package: Postman.Postman
  - name: winget
    description: Install Node.js LTS
    parameters:
      package: OpenJS.NodeJS.LTS
  - name: winget
    description: Install Azure CLI
    parameters:
      package: Microsoft.AzureCLI
  - name: git-clone
    description: Clone the eShopOnWeb repository
    parameters:
      repositoryUrl: https://github.com/sagarlankala/eshoponweb.git
      directory: 'C:\Source'
  - name: powershell
    description: Setup eShopOnWeb development environment
    parameters:
      command: "winget install --id Microsoft.DotNet.SDK.7 -e; dotnet tool install --global dotnet-ef; cd C:\\Source\\eshoponweb; dotnet restore; dotnet ef database update --context CatalogContext --project src\\Infrastructure\\Infrastructure.csproj --startup-project src\\Web\\Web.csproj; dotnet ef database update --context AppIdentityDbContext --project src\\Infrastructure\\Infrastructure.csproj --startup-project src\\Web\\Web.csproj"
